<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Kalkulátor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .slider-value {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
    }

    .slider-value span {
      font-size: 14px;
      font-weight: 600;
      color: #aaa;
      margin-left: 2px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e8e8e8;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    button:active { transform: translateY(0); }

    .result {
      margin-top: 32px;
      display: none;
    }

    .result.show { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bmi-value {
      text-align: center;
      margin-bottom: 20px;
    }

    .bmi-number {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      transition: color 0.4s;
    }

    .bmi-label {
      font-size: 18px;
      font-weight: 600;
      margin-top: 6px;
      transition: color 0.4s;
    }

    .gauge {
      position: relative;
      height: 12px;
      background: linear-gradient(to right, #3b82f6, #22c55e, #eab308, #f97316, #ef4444);
      border-radius: 999px;
      margin-bottom: 8px;
      overflow: visible;
    }

    .gauge-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: white;
      border: 3px solid #1a1a2e;
      border-radius: 50%;
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cat {
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: all 0.3s;
    }

    .cat.active {
      border-color: currentColor;
      transform: scale(1.03);
    }

    .cat-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .cat-range {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .cat-soványság  { background: #eff6ff; color: #3b82f6; }
    .cat-normális   { background: #f0fdf4; color: #22c55e; }
    .cat-túlsúlyos  { background: #fefce8; color: #ca8a04; }
    .cat-elhízott   { background: #fff7ed; color: #ea580c; }
    .cat-nagyon     { background: #fef2f2; color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BMI Kalkulátor</h1>
    <p class="subtitle">Számítsd ki a testtömegindexedet</p>

    <div class="input-group">
      <div class="slider-header">
        <label>Magasság</label>
        <div class="slider-value" id="magassagErtek">175<span>cm</span></div>
      </div>
      <input type="range" id="magassag" min="100" max="250" value="175" oninput="document.getElementById('magassagErtek').innerHTML=this.value+'<span>cm</span>'">
    </div>

    <div class="input-group">
      <div class="slider-header">
        <label>Testsúly</label>
        <div class="slider-value" id="sulyErtek">70<span>kg</span></div>
      </div>
      <input type="range" id="suly" min="30" max="200" value="70" oninput="document.getElementById('sulyErtek').innerHTML=this.value+'<span>kg</span>'">
    </div>

    <button onclick="szamol()">Kiszámít</button>

    <div class="result" id="result">
      <div class="bmi-value">
        <div class="bmi-number" id="bmiSzam">—</div>
        <div class="bmi-label" id="bmiCimke">—</div>
      </div>

      <div class="gauge">
        <div class="gauge-marker" id="marker" style="left: 0%"></div>
      </div>
      <div class="gauge-labels">
        <span>16</span>
        <span>18.5</span>
        <span>25</span>
        <span>30</span>
        <span>40</span>
      </div>

      <div class="categories">
        <div class="cat cat-soványság"  id="cat0"><div class="cat-name">Soványság</div><div class="cat-range">&lt; 18.5</div></div>
        <div class="cat cat-normális"   id="cat1"><div class="cat-name">Normális</div><div class="cat-range">18.5 – 25</div></div>
        <div class="cat cat-túlsúlyos"  id="cat2"><div class="cat-name">Túlsúlyos</div><div class="cat-range">25 – 30</div></div>
        <div class="cat cat-elhízott"   id="cat3"><div class="cat-name">Elhízott</div><div class="cat-range">30 – 40</div></div>
        <div class="cat cat-nagyon"     id="cat4" style="grid-column: span 2"><div class="cat-name">Súlyosan elhízott</div><div class="cat-range">&gt; 40</div></div>
      </div>
    </div>
  </div>

  <script>
    function szamol() {
      const m = parseFloat(document.getElementById('magassag').value);
      const s = parseFloat(document.getElementById('suly').value);
      if (!m || !s || m < 100 || s < 30) {
        alert('Kérlek adj meg érvényes értékeket!');
        return;
      }

      const bmi = s / ((m / 100) ** 2);
      const kerek = Math.round(bmi * 10) / 10;

      let cimke, szin, catIndex;
      if      (bmi < 18.5) { cimke = 'Sovány';            szin = '#3b82f6'; catIndex = 0; }
      else if (bmi < 25)   { cimke = 'Normális';           szin = '#22c55e'; catIndex = 1; }
      else if (bmi < 30)   { cimke = 'Túlsúlyos';          szin = '#ca8a04'; catIndex = 2; }
      else if (bmi < 40)   { cimke = 'Elhízott';           szin = '#ea580c'; catIndex = 3; }
      else                 { cimke = 'Súlyosan elhízott';  szin = '#ef4444'; catIndex = 4; }

      document.getElementById('bmiSzam').textContent = kerek;
      document.getElementById('bmiSzam').style.color = szin;
      document.getElementById('bmiCimke').textContent = cimke;
      document.getElementById('bmiCimke').style.color = szin;

      const pct = Math.min(Math.max((bmi - 16) / (40 - 16) * 100, 2), 98);
      document.getElementById('marker').style.left = pct + '%';

      for (let i = 0; i < 5; i++) {
        document.getElementById('cat' + i).classList.toggle('active', i === catIndex);
      }

      document.getElementById('result').classList.add('show');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') szamol(); });
  </script>
</body>
</html>
